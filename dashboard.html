<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ApexStudy | Dashboard</title>
    <style>
      :root {
        --paper: #07121f;
        --paper-strong: #0b1b2c;
        --panel: rgba(15, 32, 50, 0.78);
        --panel-soft: rgba(25, 59, 79, 0.72);
        --ink: #e7fbff;
        --ink-soft: #8eafbd;
        --line: rgba(112, 226, 255, 0.16);
        --mint: #6fffe9;
        --mint-deep: #00c7b1;
        --mint-soft: rgba(111, 255, 233, 0.12);
        --cyan: #5edbff;
        --violet: #9d8cff;
        --shadow: 0 22px 55px rgba(0, 0, 0, 0.28);
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Inter", Arial, sans-serif;
        background:
          radial-gradient(circle at 15% 5%, rgba(0, 199, 177, 0.16), transparent 28%),
          radial-gradient(circle at 88% 18%, rgba(157, 140, 255, 0.14), transparent 25%),
          linear-gradient(135deg, var(--paper), var(--paper-strong));
        color: var(--ink);
        overflow-x: hidden;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        opacity: 0.28;
        background-image:
          linear-gradient(rgba(111, 255, 233, 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(111, 255, 233, 0.07) 1px, transparent 1px);
        background-size: 42px 42px;
        mask-image: linear-gradient(to bottom, black, transparent 80%);
      }
      @keyframes fade-up {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes scale-in {
        from { opacity: 0; transform: scale(0.94); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes grow-bar {
        from { transform: scaleY(0); }
        to { transform: scaleY(1); }
      }
      @keyframes soft-pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(30, 168, 122, 0); }
        50% { box-shadow: 0 0 0 6px rgba(30, 168, 122, 0.08); }
      }
      .dashboard {
        width: min(1380px, calc(100% - 28px));
        margin: 28px auto 48px;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 18px 8px 24px;
        animation: fade-up 0.55s ease both;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-size: 1.08rem;
        font-weight: 700;
        letter-spacing: -0.04em;
      }
      .brand-mark {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--mint) 0%, var(--cyan) 100%);
        color: #06202a;
        box-shadow: 0 0 26px rgba(111, 255, 233, 0.38);
        animation: soft-pulse 3s ease-in-out 0.8s infinite;
      }
      .brand-area {
        display: flex;
        align-items: center;
        gap: 22px;
      }
      .module-nav {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .module-link {
        padding: 8px 11px;
        border-radius: 999px;
        color: var(--ink-soft);
        font-size: 0.78rem;
        font-weight: 700;
        text-decoration: none;
        transition: color 0.2s ease, background 0.2s ease, transform 0.2s ease;
      }
      .module-link:hover,
      .module-link.active {
        background: var(--mint-soft);
        color: var(--mint-deep);
      }
      .module-link:hover { transform: translateY(-2px); }
      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .pill {
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid rgba(111, 255, 233, 0.25);
        background: rgba(10, 38, 54, 0.72);
        color: var(--ink-soft);
        font-size: 0.82rem;
        font-weight: 600;
      }
      .logout {
        border: none;
        border-radius: 999px;
        background: rgba(18, 47, 66, 0.82);
        color: var(--ink);
        padding: 10px 18px;
        font-weight: 700;
        box-shadow: var(--shadow);
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      .logout:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(20, 34, 38, 0.12); }
      .logout:active, .timer-actions button:active, .save-btn:active { transform: scale(0.96); }
      .hero {
        display: grid;
        grid-template-columns: 1.3fr 0.7fr;
        gap: 20px;
        margin-bottom: 24px;
      }
      .hero-card, .feature-box, .summary-card, .subject-card, .editor-card {
        background: linear-gradient(145deg, rgba(17, 44, 63, 0.88), rgba(9, 27, 43, 0.78));
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
      }
      .hero-card {
        padding: 28px 30px;
      }
      .eyebrow {
        margin: 0 0 12px;
        color: var(--mint);
        font-size: 0.8rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-weight: 800;
      }
      .hero-card h1 {
        margin: 0;
        font-size: clamp(2.2rem, 4vw, 3.6rem);
        line-height: 0.97;
        letter-spacing: -0.07em;
      }
      .hero-card p {
        margin: 18px 0 0;
        max-width: 620px;
        color: var(--ink-soft);
      }
      .hero-card .motivation {
        margin-top: 14px;
        padding: 12px 14px;
        border-left: 3px solid var(--mint-deep);
        border-radius: 0 12px 12px 0;
        background: var(--mint-soft);
        color: var(--mint-deep);
        font-weight: 700;
      }
      .hero-side {
        display: grid;
        gap: 18px;
      }
      .feature-box {
        padding: 22px 20px;
        animation: fade-up 0.55s ease 0.12s both;
        transition: transform 0.25s ease, box-shadow 0.25s ease;
      }
      .feature-box.focus-box {
        min-height: 168px;
      }
      .focus-box #focusSummary {
        min-height: 96px;
        align-content: flex-start;
      }
      .feature-box:hover { transform: translateY(-4px); box-shadow: 0 22px 44px rgba(20, 34, 38, 0.1); }
      .feature-box h3 {
        margin: 0 0 12px;
        font-size: 1.05rem;
      }
      .daily-message {
        margin: 0;
        padding: 14px 16px;
        border-left: 4px solid var(--mint-deep);
        border-radius: 0 14px 14px 0;
        background: linear-gradient(135deg, rgba(0, 199, 177, 0.2), rgba(94, 219, 255, 0.08));
        color: var(--ink);
        font-size: 1.08rem;
        line-height: 1.55;
        font-weight: 800;
        letter-spacing: -0.02em;
        box-shadow: inset 0 0 0 1px rgba(30, 168, 122, 0.08);
        animation: message-highlight 0.7s ease both;
      }
      @keyframes message-highlight {
        from { opacity: 0; transform: translateX(-8px); }
        to { opacity: 1; transform: translateX(0); }
      }
      .chip-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 8px 10px;
        border-radius: 999px;
        background: var(--mint-soft);
        color: var(--mint);
        font-size: 0.74rem;
        font-weight: 700;
        transition: transform 0.2s ease, background 0.2s ease;
      }
      .chip:hover { transform: translateY(-2px); background: rgba(117, 224, 191, 0.3); }
      .recommendation-preview {
        margin: 12px 0 0;
        padding: 8px 10px;
        border-left: 3px solid var(--mint-deep);
        border-radius: 0 9px 9px 0;
        background: rgba(117, 224, 191, 0.1);
        color: var(--ink-soft);
        font-size: 0.74rem;
        line-height: 1.35;
      }
      .summary-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 18px;
        margin-bottom: 28px;
      }
      .summary-card {
        padding: 18px 20px;
        animation: scale-in 0.5s ease 0.18s both;
        transition: transform 0.25s ease, box-shadow 0.25s ease;
      }
      .summary-card.timer-card {
        position: relative;
        top: -28px;
        padding: 22px 20px;
        background: linear-gradient(145deg, rgba(0, 199, 177, 0.22), rgba(17, 44, 63, 0.9));
        border-color: rgba(111, 255, 233, 0.3);
      }
      .summary-card:hover { transform: translateY(-5px); box-shadow: 0 24px 44px rgba(20, 34, 38, 0.1); }
      .summary-card span {
        color: var(--ink-soft);
        font-size: 0.8rem;
      }
      .summary-card strong {
        display: block;
        margin-top: 12px;
        font-size: clamp(1.7rem, 2vw, 2.4rem);
        letter-spacing: -0.06em;
      }
      .study-timer {
        display: grid;
        gap: 8px;
        margin-top: 10px;
      }
      .study-timer strong {
        margin-top: 0;
        font-size: clamp(2.4rem, 3vw, 3.4rem);
        color: var(--mint-deep);
        letter-spacing: -0.08em;
        font-variant-numeric: tabular-nums;
      }
      .timer-fields {
        display: flex;
        gap: 6px;
      }
      .timer-fields input {
        width: 58px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px;
        background: rgba(4, 19, 32, 0.8);
        color: var(--ink);
      }
      .timer-actions {
        display: flex;
        gap: 6px;
      }
      .timer-actions button {
        border: 0;
        border-radius: 999px;
        padding: 6px 9px;
        background: var(--mint-soft);
        color: var(--mint);
        font-size: 0.72rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s ease, background 0.2s ease;
      }
      .timer-actions button:hover { transform: translateY(-2px); background: rgba(117, 224, 191, 0.32); }
      .editor-card {
        padding: 18px 20px;
        margin-bottom: 24px;
      }
      .editor-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }
      .editor-header h2 {
        margin: 0;
        font-size: 1.1rem;
      }
      .editor-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }
      .mini-field {
        display: grid;
        gap: 6px;
      }
      .mini-field label {
        color: var(--ink-soft);
        font-size: 0.75rem;
        font-weight: 700;
      }
      .mini-field input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(4, 19, 32, 0.8);
        padding: 10px 12px;
        font: inherit;
      }
      .editor-actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 18px;
      }
      .save-btn {
        border: none;
        background: linear-gradient(135deg, var(--mint) 0%, var(--mint-deep) 100%);
        color: #fff;
        border-radius: 999px;
        padding: 11px 18px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      .save-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(30, 168, 122, 0.24); }
      .subjects-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 20px;
      }
      .subject-card {
        padding: 18px 18px 16px;
        animation: fade-up 0.55s ease both;
        transition: transform 0.28s ease, box-shadow 0.28s ease, border-color 0.28s ease;
      }
      .subject-card:hover {
        transform: translateY(-7px);
        border-color: rgba(111, 255, 233, 0.42);
        box-shadow: 0 24px 46px rgba(20, 34, 38, 0.12);
      }
      .subject-card:nth-child(2) { animation-delay: 0.08s; }
      .subject-card:nth-child(3) { animation-delay: 0.16s; }
      .subject-card:nth-child(4) { animation-delay: 0.24s; }
      .subject-card:nth-child(5) { animation-delay: 0.32s; }
      .subject-card:nth-child(6) { animation-delay: 0.4s; }
      .subject-header {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
        margin-bottom: 14px;
      }
      .subject-header h2 {
        margin: 0;
        font-size: 1.1rem;
      }
      .subject-badge {
        padding: 6px 9px;
        border-radius: 999px;
        background: rgba(111, 255, 233, 0.12);
        color: var(--mint);
        font-size: 0.7rem;
        font-weight: 800;
      }
      .grade-wrap {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 12px;
        margin-bottom: 14px;
      }
      .grade {
        font-size: 2.2rem;
        font-weight: 800;
        letter-spacing: -0.08em;
      }
      .grade.low {
        color: #d9485f;
      }
      .trend {
        color: var(--mint-deep);
        font-size: 0.76rem;
        font-weight: 700;
      }
      .mini-chart {
        height: 84px;
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 10px;
        margin: 6px 0 14px;
        padding: 10px 8px 0;
        border-radius: 12px;
        background: linear-gradient(180deg, rgba(94,219,255,0.12), rgba(0,0,0,0));
      }
      .chart-column {
        flex: 1;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: end;
        gap: 3px;
      }
      .chart-value {
        color: var(--ink);
        font-size: 0.66rem;
        font-weight: 800;
      }
      .chart-bar {
        display: block;
        width: min(30px, 72%);
        min-height: 3px;
        border-radius: 8px 8px 0 0;
        background: linear-gradient(180deg, var(--cyan) 0%, var(--mint-deep) 100%);
        box-shadow: 0 0 12px rgba(94, 219, 255, 0.35);
        opacity: 0.9;
        transform-origin: bottom;
        animation: grow-bar 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .chart-label {
        color: var(--ink-soft);
        font-size: 0.62rem;
        font-weight: 700;
      }
      .metric-row {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        margin-top: 8px;
      }
      .metric {
        background: rgba(4, 19, 32, 0.52);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 9px 8px;
      }
      .metric-label {
        display: block;
        color: var(--ink-soft);
        font-size: 0.7rem;
      }
      .metric strong {
        display: block;
        margin-top: 6px;
        font-size: 0.98rem;
      }
      .bottom-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-top: 16px;
      }
      .progress {
        flex: 1;
        height: 9px;
        border-radius: 999px;
        background: rgba(3, 16, 28, 0.8);
        overflow: hidden;
      }
      .progress span {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--cyan) 0%, var(--mint-deep) 100%);
        box-shadow: 0 0 12px rgba(111, 255, 233, 0.42);
        transform-origin: left;
        animation: scale-in 0.8s ease 0.35s both;
      }
      .progress.low span {
        background: linear-gradient(90deg, #f58b8b 0%, #d9485f 100%);
      }
      .status {
        min-width: 86px;
        text-align: center;
        font-size: 0.72rem;
        font-weight: 800;
        color: var(--mint);
        background: var(--mint-soft);
        border-radius: 999px;
        padding: 7px 8px;
      }
      .status.low {
        color: #b4233c;
        background: rgba(240, 111, 122, 0.16);
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
      @media (min-width: 761px) {
        body { padding-left: 228px; }
        .topbar {
          position: fixed;
          z-index: 10;
          inset: 0 auto 0 0;
          width: 208px;
          min-height: 100vh;
          padding: 28px 16px;
          flex-direction: column;
          align-items: stretch;
          justify-content: flex-start;
          gap: 28px;
          border-right: 1px solid var(--line);
          background: rgba(7, 24, 39, 0.94);
          backdrop-filter: blur(16px);
        }
        .brand-area, .topbar-actions { flex-direction: column; align-items: stretch; gap: 18px; }
        .module-nav { flex-direction: column; align-items: stretch; gap: 8px; }
        .module-link { display: block; }
        .topbar-actions { margin-top: auto; }
        .pill { text-align: center; }
      }
      @media (max-width: 1100px) {
        .hero { grid-template-columns: 1fr; }
        .editor-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
        .subjects-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
      @media (max-width: 720px) {
        .summary-grid, .editor-grid, .subjects-grid { grid-template-columns: 1fr; }
        .summary-card.timer-card { top: 0; }
        .topbar,
        .brand-area {
          flex-direction: column;
          align-items: flex-start;
        }
        .module-nav { flex-wrap: wrap; }
      }
    </style>
  </head>
  <body>
    <div class="dashboard">
      <header class="topbar">
        <div class="brand-area">
          <div class="brand">
            <span class="brand-mark">A</span>
            <span>ApexStudy</span>
          </div>
          <nav class="module-nav" aria-label="Módulos">
            <a class="module-link active" href="/dashboard.html">Dashboard</a>
            <a class="module-link" href="/materias.html">Materias</a>
            <a class="module-link" href="/recomendaciones.html">Recomendaciones</a>
            <a class="module-link" href="/configuracion.html">Configuración</a>
          </nav>
        </div>

        <div class="topbar-actions">
          <span class="pill" id="careerPill">Semestre 2 · Ingeniería de Sistemas</span>
          <button class="logout" onclick="logout()">Cerrar sesión</button>
        </div>
      </header>

      <section class="hero">
        <div class="hero-side">
          <div class="feature-box">
            <h3>Mensaje del día</h3>
            <p class="daily-message" id="motivationMessage" aria-live="polite"></p>
          </div>

          <div class="feature-box focus-box">
            <h3>Foco esta semana</h3>
            <div class="chip-row" id="focusSummary"></div>
          </div>
        </div>
      </section>

      <section class="summary-grid">
        <article class="summary-card">
          <span>Promedio general</span>
          <strong id="avgLabel">4.1</strong>
        </article>
        <article class="summary-card">
          <span>Materias activas</span>
          <strong id="subjectCount">6</strong>
        </article>
        <article class="summary-card">
          <span>Entregas próximas</span>
          <strong>3</strong>
        </article>
        <article class="summary-card timer-card">
          <span>Tiempo de estudio</span>
          <div class="study-timer">
            <strong id="studyTimer">00:00:00</strong>
            <div class="timer-fields">
              <input id="studyHours" type="number" min="0" max="99" value="0" aria-label="Horas de estudio" />
              <input id="studyMinutes" type="number" min="0" max="59" value="0" aria-label="Minutos de estudio" />
            </div>
            <div class="timer-actions">
              <button id="startTimer" type="button">Iniciar</button>
              <button id="resetTimer" type="button">Reiniciar</button>
            </div>
          </div>
        </article>
      </section>

      <section class="subjects-grid" id="subjectsGrid"></section>
    </div>

    <script>
      const token = sessionStorage.getItem("studytrack_token");
      if (!token) {
        window.location.href = "/";
      }

      const STORAGE_KEY = "studytrack_subjects";
      const subjectTemplates = [
        { name: "Programación Web", short: "Web", corte1: 4.5, corte2: 4.5, corte3: 4.5, participation: 0, attendance: 95, tasks: 4, chart: [45, 56, 63, 72, 76, 90] },
        { name: "Base de Datos", short: "DB", corte1: 4.3, corte2: 4.3, corte3: 4.3, participation: 0, attendance: 92, tasks: 3, chart: [40, 46, 58, 63, 68, 84] },
        { name: "Algoritmia", short: "Algo", corte1: 4.0, corte2: 4.0, corte3: 4.0, participation: 0, attendance: 90, tasks: 5, chart: [32, 38, 42, 51, 69, 79] },
        { name: "Matemática Discreta", short: "MD", corte1: 3.9, corte2: 3.9, corte3: 3.9, participation: 0, attendance: 88, tasks: 4, chart: [29, 36, 44, 49, 61, 78] },
        { name: "Sistemas Operativos", short: "SO", corte1: 4.2, corte2: 4.2, corte3: 4.2, participation: 0, attendance: 94, tasks: 3, chart: [38, 46, 57, 62, 76, 84] },
        { name: "Arquitectura de Computadores", short: "AC", corte1: 4.1, corte2: 4.1, corte3: 4.1, participation: 0, attendance: 91, tasks: 4, chart: [35, 44, 50, 65, 74, 82] }
      ];

      let requestedSubjectCount = 6;

      function getDefaultSubjects(count) {
        return Array.from({ length: count }, (_, index) => {
          return {
            name: `Materia ${index + 1}`,
            short: `M${index + 1}`,
            corte1: 0,
            corte2: 0,
            corte3: 0,
            participation: 0,
            attendance: 0,
            tasks: 0,
            chart: [20, 30, 40]
          };
        });
      }

      function getSubjects() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) {
          const defaults = getDefaultSubjects(requestedSubjectCount);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(defaults));
          return defaults;
        }

        try {
          const parsed = JSON.parse(saved);
          if (!Array.isArray(parsed) || !parsed.length) return getDefaultSubjects(requestedSubjectCount);
          return parsed.map(subject => ({
            ...subject,
            focus: typeof subject.focus === "string" ? subject.focus : "",
            participation: Number(subject.participation) || 0,
            corte1: Number(subject.corte1 ?? subject.grade) || 0,
            corte2: Number(subject.corte2 ?? subject.grade) || 0,
            corte3: Number(subject.corte3 ?? subject.grade) || 0
          }));
        } catch (error) {
          return getDefaultSubjects(requestedSubjectCount);
        }
      }

      function saveSubjects(subjects) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(subjects));
      }

      async function loadUserProfile() {
        const response = await fetch(`${window.location.origin}/api/auth/profile`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (!response.ok) throw new Error("No se pudo cargar el perfil del usuario");
        return response.json();
      }

      function getAutomaticStatus(grade) {
        if (grade < 3) return "Bajo";
        if (grade < 4) return "Bueno";
        return "Alto";
      }

      function getFinalGrade(baseGrade, participation) {
        return Math.min(5, Math.max(0, Number(baseGrade) + Number(participation)));
      }

      function getBaseGrade(subject) {
        return (
          Number(subject.corte1) * 0.3 +
          Number(subject.corte2) * 0.3 +
          Number(subject.corte3) * 0.4
        );
      }

      function getSemesterAverage(subjects) {
        if (!subjects.length) return 0;
        return subjects.reduce(
          (sum, subject) => sum + getFinalGrade(getBaseGrade(subject), subject.participation),
          0
        ) / subjects.length;
      }

      const TIMER_KEY = "studytrack_study_timer";
      let timerState = loadTimerState();
      let timerSeconds = timerState.seconds;
      let timerInterval = null;

      function loadTimerState() {
        const saved = localStorage.getItem(TIMER_KEY);
        if (!saved) return { seconds: 0, running: false, endAt: null };

        try {
          const parsed = JSON.parse(saved);
          if (parsed && typeof parsed === "object") {
            const seconds = Math.max(0, Number(parsed.seconds) || 0);
            const running = parsed.running === true && Number(parsed.endAt) > Date.now();
            return {
              seconds: running ? Math.ceil((Number(parsed.endAt) - Date.now()) / 1000) : seconds,
              running,
              endAt: running ? Number(parsed.endAt) : null
            };
          }
        } catch (error) {
          const legacySeconds = Number(saved);
          if (Number.isFinite(legacySeconds)) {
            return { seconds: Math.max(0, legacySeconds), running: false, endAt: null };
          }
        }

        return { seconds: 0, running: false, endAt: null };
      }

      function saveTimerState() {
        localStorage.setItem(TIMER_KEY, JSON.stringify(timerState));
      }

      function formatTimer(seconds) {
        const hours = Math.floor(seconds / 3600);
        const minutes = Math.floor((seconds % 3600) / 60);
        const remainingSeconds = seconds % 60;
        return [hours, minutes, remainingSeconds].map(value => String(value).padStart(2, "0")).join(":");
      }

      function renderTimer() {
        if (timerState.running) {
          timerSeconds = Math.max(0, Math.ceil((timerState.endAt - Date.now()) / 1000));
          timerState.seconds = timerSeconds;
          if (timerSeconds === 0) {
            timerState.running = false;
            timerState.endAt = null;
            saveTimerState();
            clearInterval(timerInterval);
            timerInterval = null;
            document.getElementById("startTimer").textContent = "Iniciar";
          }
        }
        document.getElementById("studyTimer").textContent = formatTimer(timerSeconds);
      }

      function startStudyTimer() {
        if (timerState.running) {
          renderTimer();
          timerState.running = false;
          timerState.endAt = null;
          timerState.seconds = timerSeconds;
          saveTimerState();
          clearInterval(timerInterval);
          timerInterval = null;
          document.getElementById("startTimer").textContent = "Iniciar";
          return;
        }

        const hours = Number(document.getElementById("studyHours").value) || 0;
        const minutes = Number(document.getElementById("studyMinutes").value) || 0;
        if (timerSeconds === 0 && (hours > 0 || minutes > 0)) {
          timerSeconds = hours * 3600 + minutes * 60;
        }

        if (timerSeconds <= 0) return;

        timerState = {
          seconds: timerSeconds,
          running: true,
          endAt: Date.now() + timerSeconds * 1000
        };
        saveTimerState();
        clearInterval(timerInterval);
        timerInterval = setInterval(renderTimer, 250);
        document.getElementById("startTimer").textContent = "Pausar";
        renderTimer();
      }

      function resetStudyTimer() {
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
        timerSeconds = 0;
        timerState = { seconds: 0, running: false, endAt: null };
        localStorage.removeItem(TIMER_KEY);
        document.getElementById("startTimer").textContent = "Iniciar";
        renderTimer();
      }

      function renderCards(subjects) {
        const grid = document.getElementById("subjectsGrid");
        grid.innerHTML = subjects.map(subject => {
          const baseGrade = getBaseGrade(subject);
          const grade = getFinalGrade(baseGrade, subject.participation);
          const isLow = grade < 3;
          const status = getAutomaticStatus(grade);
          const cutProgress = [subject.corte1, subject.corte2, subject.corte3]
            .map(value => Math.min(100, Math.max(0, Number(value) * 20)));

          return `
          <article class="subject-card">
            <div class="subject-header">
              <h2>${subject.name}</h2>
              <span class="subject-badge">${subject.short}</span>
            </div>
            <div class="chip-row">
              <span class="chip">${subject.focus || "Sin foco definido"}</span>
            </div>
            ${subject.recommendation ? `<p class="recommendation-preview"><strong>Recomendación:</strong> ${subject.recommendation}</p>` : ""}
            <div class="grade-wrap">
              <div class="grade${isLow ? " low" : ""}">${grade.toFixed(1)}</div>
              <div class="trend">Nota final</div>
            </div>
            <div class="mini-chart" aria-label="Gráfico de progreso de ${subject.name}">
              ${cutProgress.map((value, index) => {
                const gradeValue = (value / 20).toFixed(1);
                return `<div class="chart-column" title="Corte ${index + 1}: ${gradeValue}">
                  <span class="chart-value">${gradeValue}</span>
                  <span class="chart-bar" style="height: ${value}%"></span>
                  <span class="chart-label">Corte ${index + 1}</span>
                </div>`;
              }).join("")}
            </div>
            <div class="metric-row">
              <div class="metric">
                <span class="metric-label">Asist.</span>
                <strong>${subject.attendance}%</strong>
              </div>
              <div class="metric">
                <span class="metric-label">Tareas</span>
                <strong>${subject.tasks}</strong>
              </div>
              <div class="metric">
                <span class="metric-label">Cortes</span>
                <strong>${Number(subject.corte1).toFixed(1)} · ${Number(subject.corte2).toFixed(1)} · ${Number(subject.corte3).toFixed(1)}</strong>
              </div>
              <div class="metric">
                <span class="metric-label">Participación</span>
                <strong>+${Number(subject.participation).toFixed(1)}</strong>
              </div>
            </div>
            <div class="bottom-row">
              <div class="progress${isLow ? " low" : ""}"><span style="width: ${Math.min(100, Math.max(0, grade * 20))}%"></span></div>
              <span class="status${isLow ? " low" : ""}">${status}</span>
            </div>
          </article>
        `;
        }).join("");

        document.getElementById("avgLabel").textContent = getSemesterAverage(subjects).toFixed(1);
        document.getElementById("subjectCount").textContent = subjects.length;
        const focusSummary = document.getElementById("focusSummary");
        const focuses = subjects
          .map(subject => subject.focus)
          .filter(Boolean)
          .slice(0, 6);
        focusSummary.innerHTML = focuses.length
          ? focuses.map(focus => `<span class="chip">${focus}</span>`).join("")
          : '<span class="chip">Define el foco de cada materia</span>';
      }

      function handleSubmit(event) {
        event.preventDefault();
        const form = event.target;
        const subjects = getSubjects();

        subjects.forEach((subject, index) => {
          const nextName = form.elements[`name-${index}`].value.trim() || subject.name;
          const nextShort = form.elements[`short-${index}`].value.trim() || subject.short;
          const nextFocus = form.elements[`focus-${index}`].value.trim();
          const nextCorte1 = Number(form.elements[`corte1-${index}`].value) || 0;
          const nextCorte2 = Number(form.elements[`corte2-${index}`].value) || 0;
          const nextCorte3 = Number(form.elements[`corte3-${index}`].value) || 0;
          const nextParticipation = Number(form.elements[`participation-${index}`].value) || 0;
          const nextAttendance = Number(form.elements[`attendance-${index}`].value) || subject.attendance;
          const nextTasks = Number(form.elements[`tasks-${index}`].value) || subject.tasks;

          subject.name = nextName;
          subject.short = nextShort;
          subject.focus = nextFocus;
          subject.corte1 = Math.min(5, Math.max(0, nextCorte1));
          subject.corte2 = Math.min(5, Math.max(0, nextCorte2));
          subject.corte3 = Math.min(5, Math.max(0, nextCorte3));
          subject.participation = Math.min(5, Math.max(0, nextParticipation));
          subject.attendance = Math.min(100, Math.max(0, nextAttendance));
          subject.tasks = nextTasks;
          subject.chart = subject.chart.length ? subject.chart : [40, 50, 60, 70, 80, 90];
        });

        saveSubjects(subjects);
        renderCards(subjects);
      }

      async function init() {
        const profile = await loadUserProfile();
        requestedSubjectCount = Math.min(20, Math.max(1, Number(profile.subjectsCount) || 6));
        document.getElementById("careerPill").textContent =
          profile.career ? `Semestre 2 · ${profile.career}` : "Semestre 2";
        const subjects = getSubjects();
        renderCards(subjects);
        showMotivationalMessage();
        renderTimer();
        if (timerState.running) {
          document.getElementById("startTimer").textContent = "Pausar";
          timerInterval = setInterval(renderTimer, 250);
        }
        document.getElementById("startTimer").addEventListener("click", startStudyTimer);
        document.getElementById("resetTimer").addEventListener("click", resetStudyTimer);
        document.addEventListener("visibilitychange", renderTimer);
      }

      function logout() {
        sessionStorage.removeItem("studytrack_token");
        window.location.href = "/";
      }

      init().catch((error) => {
        console.error(error);
        document.getElementById("careerPill").textContent = "No se pudo cargar el perfil";
      });
    </script>
