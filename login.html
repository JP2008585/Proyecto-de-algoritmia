<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ApexStudy — Iniciar sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #e7fbff;
        --paper: #07121f;
        --mint: #6fffe9;
        --mint-deep: #00c7b1;
        --muted: #8eafbd;
        --line: rgba(112, 226, 255, 0.16);
        font-family: "Inter", sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      @keyframes card-enter {
        from { opacity: 0; transform: translateY(18px) scale(0.97); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes title-enter {
        from { opacity: 0; transform: translateX(-10px); }
        to { opacity: 1; transform: translateX(0); }
      }
      @keyframes button-shine {
        from { transform: translateX(-120%) skewX(-18deg); }
        to { transform: translateX(120%) skewX(-18deg); }
      }

      body {
        background:
          radial-gradient(circle at 15% 20%, rgba(117, 224, 191, 0.2), transparent 30%),
          linear-gradient(135deg, var(--paper), #0b1b2c);
        color: var(--ink);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        width: 100%;
        max-width: 380px;
        background: rgba(15, 32, 50, 0.92);
        border: 1px solid var(--line);
        border-radius: 30px;
        padding: 36px 32px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.3);
        animation: card-enter 0.65s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      h1 {
        font-family: "Fraunces", serif;
        font-weight: 500;
        font-size: clamp(2rem, 5vw, 2.7rem);
        line-height: 1;
        letter-spacing: -0.06em;
        text-align: center;
        margin-bottom: 6px;
        animation: title-enter 0.55s ease 0.15s both;
      }

      .sub {
        color: var(--muted);
        font-size: 1.12rem;
        line-height: 1.35;
        text-align: center;
        font-weight: 600;
        margin: 12px 0 26px;
        animation: title-enter 0.55s ease 0.22s both;
      }

      label {
        display: block;
        font-size: 13.5px;
        color: var(--muted);
        margin-bottom: 6px;
        margin-top: 14px;
      }

      input {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid var(--line);
        border-radius: 15px;
        font-size: 14.5px;
        font-family: "Inter", sans-serif;
        background: rgba(4, 19, 32, 0.8);
        color: var(--ink);
        transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease, background 0.2s ease;
      }

      input::placeholder {
        color: var(--muted);
        opacity: 1;
      }

      input:focus {
        outline: none;
        border-color: var(--mint);
        background: rgba(15, 32, 50, 0.92);
        box-shadow: 0 0 0 4px rgba(46, 158, 130, 0.14), 0 8px 18px rgba(28, 42, 46, 0.08);
        transform: translateY(-2px);
      }

      button.submit {
        width: 100%;
        margin-top: 22px;
        padding: 12px;
        background: var(--mint-deep);
        color: #fff;
        border: none;
        border-radius: 16px;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      }

      button.submit:hover {
        background: var(--ink);
        transform: translateY(-3px);
        box-shadow: 0 12px 24px rgba(28, 42, 46, 0.2);
      }
      button.submit:active { transform: scale(0.97); }
      button.submit::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 35%;
        background: rgba(255, 255, 255, 0.18);
        transform: translateX(-120%) skewX(-18deg);
      }
      button.submit:hover::after { animation: button-shine 0.7s ease; }

      .switch {
        text-align: center;
        margin-top: 18px;
        font-size: 13.5px;
        color: var(--muted);
      }

      .switch a {
        color: var(--mint-deep);
        font-weight: 500;
        text-decoration: none;
        transition: color 0.2s ease, letter-spacing 0.2s ease;
      }
      .switch a:hover { color: var(--ink); letter-spacing: 0.02em; }

      .error {
        color: #b3261e;
        font-size: 13px;
        margin-top: 10px;
        display: none;
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Bienvenido a ApexStudy</h1>
      <p class="sub" id="formSubtitle"></p>

      <form id="authForm">
        <div id="nameField" style="display: none">
          <label for="name">Nombre</label>
          <input type="text" id="name" placeholder="Tu nombre" />
        </div>

        <div id="careerField" style="display: none">
          <label for="career">¿A qué carrera perteneces?</label>
          <input type="text" id="career" placeholder="Ingeniería de Sistemas" />
        </div>

        <div id="subjectsCountField" style="display: none">
          <label for="subjectsCount">¿Cuántas materias tienes?</label>
          <input type="number" id="subjectsCount" min="1" max="20" value="6" required />
        </div>

        <label for="email">Correo</label>
        <input type="email" id="email" placeholder="tucorreo@universidad.edu" required />

        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required minlength="6" />

        <p class="error" id="errorMsg"></p>
        <button type="submit" class="submit" id="submitBtn">Iniciar sesión</button>
      </form>

      <p class="switch" id="switchText">
        ¿No tienes cuenta? <a href="#" id="switchLink">Regístrate</a>
      </p>
    </div>

    <script>
      const API_BASE = `${window.location.origin}/api`;
      let isRegisterMode = false;

      function updateAuthView() {
        const nameField = document.getElementById("nameField");
        const careerField = document.getElementById("careerField");
        const subjectsCountField = document.getElementById("subjectsCountField");
        const submitBtn = document.getElementById("submitBtn");
        const formSubtitle = document.getElementById("formSubtitle");
        const switchText = document.getElementById("switchText");

        nameField.style.display = isRegisterMode ? "block" : "none";
        careerField.style.display = isRegisterMode ? "block" : "none";
        subjectsCountField.style.display = isRegisterMode ? "block" : "none";
        document.getElementById("career").required = isRegisterMode;
        submitBtn.textContent = isRegisterMode ? "Crear cuenta" : "Iniciar sesión";
        formSubtitle.textContent = isRegisterMode
          ? "Crea tu cuenta para empezar"
          : "";

        switchText.innerHTML = isRegisterMode
          ? '¿Ya tienes cuenta? <a href="#" id="switchLink">Inicia sesión</a>'
          : '¿No tienes cuenta? <a href="#" id="switchLink">Regístrate</a>';

        document.getElementById("switchLink").addEventListener("click", (event) => {
          event.preventDefault();
          isRegisterMode = !isRegisterMode;
          updateAuthView();
        });
      }

      document.getElementById("authForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const name = document.getElementById("name").value.trim();
        const career = document.getElementById("career").value.trim();
        const subjectsCount = Number(document.getElementById("subjectsCount").value);

        const endpoint = isRegisterMode ? "/auth/register" : "/auth/login";
        const payload = isRegisterMode
          ? { name, email, password, career, subjectsCount }
          : { email, password };

        try {
          const res = await fetch(`${API_BASE}${endpoint}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          const data = await res.json();
          if (!res.ok) throw new Error(data.message || "Error de autenticación");

          sessionStorage.setItem("studytrack_token", data.token);
          if (isRegisterMode) {
            localStorage.removeItem("studytrack_subjects");
            localStorage.removeItem("studytrack_study_timer");
          }
          window.location.href = "/dashboard.html";
        } catch (err) {
          const el = document.getElementById("errorMsg");
          el.textContent = err.message;
          el.style.display = "block";
        }
      });

      document.addEventListener("DOMContentLoaded", () => {
        updateAuthView();
      });
    </script>
  </body>
</html>
